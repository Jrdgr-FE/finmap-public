location = /finmap/monitor.json {
    alias /var/lib/finmap-monitor/public/monitor.json;
    default_type application/json;
    add_header Cache-Control "public, max-age=60";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Monitor-Schema 1 always;
    limit_except GET { deny all; }
    gzip on;
    gzip_types application/json;
}
location = /finmap/directory.json {
    alias /var/lib/finmap-monitor/public/directory.json;
    default_type application/json;
    add_header Cache-Control "public, max-age=60";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Monitor-Schema 1 always;
    limit_except GET { deny all; }
    gzip on;
    gzip_types application/json;
}
location ~ "^/finmap/company/([a-z0-9-]{1,100})\.json$" {
    alias /var/lib/finmap-monitor/public/company/$1.json;
    default_type application/json;
    add_header Cache-Control "public, max-age=60";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Monitor-Schema 1 always;
    limit_except GET { deny all; }
    gzip on;
    gzip_types application/json;
}
