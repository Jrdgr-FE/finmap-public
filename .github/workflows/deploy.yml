name: Deploy to Cloudflare Pages

# Manual only in this public copy. Set the CLOUDFLARE_API_TOKEN secret and the
# CLOUDFLARE_ACCOUNT_ID variable before running it.
on:
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:ventures
      - run: npm run test:ui
      - name: Prepare public company monitoring registry
        run: npm run monitor:prepare
      - name: Refresh static monitoring fallback
        run: node scripts/monitor-snapshot.mjs
      - name: Refresh public company news
        run: npm run ventures:news -- --refresh
      - name: Surface partial source failures
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const data=JSON.parse(fs.readFileSync('public/data/venture-news.json','utf8'));
          if(data.degraded)console.log('::warning::Some public news feeds failed; retained their last successful archive. Check data/news/metadata.json.');
          if(data.fetch.truncated)console.log('::notice::FinHot fetch is bounded; historical coverage is limited to the recorded fetch window.');
          JS
      - run: npm run validate
      - run: npm run check
      - run: npm run build
      - name: Save only allowlisted public archive files
        run: |
          git add public/data/venture-news.json data/news/public-history.json data/news/metadata.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh public company news archive"
            git push origin HEAD:main
          fi
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Cloudflare deployment token missing'; exit 1; }
          npx wrangler pages deploy dist --project-name=finmap --branch=main
