# 硬科技图谱 · 智能驾驶与低空出行（2026-10-22 调研）
# 结构和口径同 ventures.yaml。Wayve、Waabi 已在世界模型赛道收录，这里不重复。
version: 1
updated: "2026-10-22"

tracks:
  - id: autonomy
    name: 智能驾驶与低空出行
    desc: 让车和飞行器自己开、自己飞的公司：卖给车厂的智驾方案、自营 Robotaxi、无人配送车和无人机，以及载人 eVTOL 和飞行汽车。
    segments:
      - { id: adas, name: 量产·智驾方案, desc: 卖给车厂的辅助驾驶和城市 NOA 软硬件方案，按搭载量收费。 }
      - { id: robotaxi, name: 运营·Robotaxi, desc: 无安全员的自动驾驶出租车，自建或与平台合作运营。 }
      - { id: delivery, name: 运营·无人配送, desc: 城配无人货车（RoboVan）和配送无人机，最先跑通单位经济的场景。 }
      - { id: evtol, name: 低空·eVTOL 与飞行汽车, desc: 电动垂直起降飞行器和飞行汽车，卡在适航取证和量产交付。 }

      - { id: sensors, name: 上游·感知硬件, desc: 激光雷达、三维视觉与车载感知系统。 }

