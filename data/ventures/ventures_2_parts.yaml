updated: "2026-10-22"

tracks:
  - id: robot-parts
    name: 机器人核心部件
    desc: 人形和各类机器人身上最贵、最难做的部件，决定整机成本和能干多精细的活：灵巧手、关节执行器和触觉等传感器。
    segments:
      - { id: hands, name: 末端·灵巧手, desc: 多自由度五指灵巧手和夹爪，机器人“手”的能力决定能做多少种活。 }
      - { id: actuators, name: 本体·关节与执行器, desc: 电机、减速器、丝杠集成的关节模组和直驱模块，人形整机成本的大头。 }
      - { id: sensors, name: 感知·视觉、触觉与力觉, desc: 三维视觉、激光雷达、电子皮肤与力传感器等机器人感知部件。 }

      - { id: simulation, name: 开发·仿真与数据, desc: 仿真环境、合成数据与机器人开发平台。 }

