# 硬科技图谱 · AI 芯片与算力（2026-10-22 调研）
# 结构和口径同 ventures.yaml。已上市公司保留在图谱里，事件以上市和最新财报为主。
version: 1
updated: "2026-10-22"

tracks:
  - id: ai-compute
    name: AI 芯片与算力
    desc: 给大模型提供算力的硬件和基础设施公司，从训练和推理芯片、芯片间互联，到算力云和数据中心。
    segments:
      - { id: training, name: 上游·训练与通用加速, desc: 能做大模型训练的 GPU 和通用 AI 加速器，国产替代的主战场。 }
      - {
          id: inference,
          name: 上游·推理与专用芯片,
          desc: 为推理优化的专用芯片（ASIC、存算一体、车端），押注推理需求超过训练。
        }
      - { id: interconnect, name: 中游·互联与光通信, desc: 芯片间和机柜间的光互联、共封装光学（CPO），决定集群能堆多大。 }
      - { id: cloud, name: 下游·算力云与数据中心, desc: 采购芯片、建数据中心、按算力出租给模型公司的“新云”。 }

      - { id: systems, name: 中游·算力系统, desc: 服务器、集群与软硬件协同系统。 }
      - {
          id: optimization,
          name: 软件·算子与算力优化,
          desc: 算子开发、编译与模型适配，研究将芯片能力转化为可交付算力的工具与工程服务。
        }

