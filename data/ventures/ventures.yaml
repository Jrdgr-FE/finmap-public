# 硬科技初创公司图谱 · 初始数据（2026-10-21 调研）
# 结构：tracks（赛道）→ segments（产业链环节）→ companies（公司 + 带日期和来源的事件）
# 事件 status: confirmed = 公司官宣或多家媒体确认；reported = 传闻 / 洽谈中 / 单一来源
# match（可选）：候选动态脚本只按这些词匹配新闻，给名字是常用词的公司（Ultra、Sunday、Runway）防误报
version: 1
updated: "2026-10-22"

tracks:
  - id: embodied
    name: 具身智能
    desc: 让 AI 拥有身体、能在物理世界里干活的机器人公司，从零部件和数据到大脑模型、整机和落地场景。
    segments:
      - { id: components-data, name: 上游·部件与数据, desc: 灵巧手、关节、传感器，以及采集机器人训练数据的硬件和服务。 }
      - { id: brain, name: 中游·具身大脑, desc: 通用机器人基础模型（VLA 等），不绑定或弱绑定某一款本体。 }
      - { id: body, name: 中游·整机本体, desc: 人形、轮式双臂、四足等整机，通常自研模型与本体协同。 }
      - { id: application, name: 下游·场景与运营, desc: 面向零售、仓储、家庭、工业、高危作业等具体场景的产品和运营。 }
  - id: world-model
    name: 世界模型
    desc: 学习物理世界如何运行、能预测和生成环境变化的模型公司。
    segments:
      - { id: general, name: 通用世界模型, desc: 面向通用场景的世界模型基座与交互式世界生成。 }
      - { id: embodied-driving, name: 具身与驾驶世界模型, desc: 以世界模型驱动机器人或自动驾驶，或为其生成训练数据。 }

