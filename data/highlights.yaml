# 图谱里几个容易搞错的事实。
# 这些是编辑内容，但同样挂来源——它们比目录本身更能说明这份图谱的价值。

- id: pingan-no-fhc
  title: 中国平安没有金融控股公司牌照
  body: >-
    中国人民银行 2022 年 3 月把首批金融控股公司牌照发给了中信金控与北京金融控股集团，招商局金融控股在 2022 年 9 月成为第三家。这份名单里始终没有中国平安。它走的是另一条路：集团本级直接控股各金融子公司，分业持牌，而不是把金融股权收进一张金控牌照。所以它的 28 个持牌主体散挂在集团本级和几个中间层下面，没有金控节点——
    这也让它的谱系图长成了一片灌木，而不是中信、招商局那样的树。
  year: 2022
  link: /group/pingan/
  source:
    title: 经济观察网《首批金融控股公司牌照落地》
    url: https://www.eeo.com.cn/2022/0317/526036.shtml
    date: "2022-03-17"

- id: citic-jiantou-not-citic
  title: 中信建投顶着"中信"字号，但不受中信集团控股
  body: >-
    2005 年中信证券与中国建银合资设立中信建投，中信证券原持股 60%。2010 年转让 53% 股权后降至 5.58%，
    2019 年 6 月公告清仓式减持，彻底退出。现在中信建投的第一大股东是北京金融控股集团（34.61%）。中信集团官网仍把它列在综合金融服务板块，这是最容易读错的一处。
  year: 2019
  link: /org/citic-jiantou/
  source:
    title: 每日经济新闻《中信证券要清仓减持中信建投！》
    url: https://www.nbd.com.cn/articles/2019-06-25/1347159.html
    date: "2019-06-25"

- id: citic-sec-no-controller
  title: 中信证券没有控股股东，也没有实际控制人
  body: >-
    中信金控以 19.84% 位居中信证券第一大股东，但公司公告口径明确写的是"无控股股东及实际控制人"。也就是说中信证券是被中信金控并表，而不是被控股——持股比例第一大和"控股"在法律上不是一回事。同类情况还有中信银行 64.95% 与招商银行 26.32%，三家放在一起看，才知道"并表口径"有多不统一。
  year: 2025
  link: /org/citic-securities/
  source:
    title: 中信证券公开发行公司债券文件（中诚信国际评级）
    url: https://static.sse.com.cn/disclosure/bond/announcement/company/c/new/2026-05-25/245320_20260525_O03I.pdf
    date: "2026-05-25"

- id: cmb-aggregate-stake
  title: 招商银行那 26.32%，是四条通道加出来的
  body: >-
    招商局集团对招商银行的持股分散在招商局轮船（13.04%）、晏清投资（4.99%）、招商金控（4.55%）、楚源投资（3.74%）四个主体上，年报并没有直接披露"集团合计"这个数字。所以本站给这类比例打上
    "合计"标记——直接持股口径和合计口径能差出二十多个百分点，混着看会得出完全错误的结论。
  year: 2025
  link: /org/cm-merchants-bank/
  source:
    title: 招商银行 2025 年年度报告（H 股）
    url: https://www.hkexnews.hk/listedco/listconews/sehk/2026/0327/2026032703380_c.pdf
    date: "2026-03-27"
