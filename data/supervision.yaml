note: >
  本层收录"定规则、发牌照、办登记清算"的机构：中央银行、国务院金融管理部门、全国性行业自律组织、证券期货与要素交易场所、登记结算与基础平台、支付清算机构。只收在中国境内依法设立、目前仍在运作的
  法人主体，不收商业性金融机构、地方金融组织、地方交易场所，也不含任何分支机构。原中国银行保险监督管理委员会已于 2023 年机构改革中撤销，不再单列：其银行业、保险业监管职责与
  中国人民银行的部分消费者保护职责由国家金融监督管理总局承继，2023 年 5 月 18 日挂牌，原银保监会成为历史。
sources:
  - { title: "中国人民银行", url: "https://www.pbc.gov.cn", date: "2026-09-30" }
  - { title: "国家金融监督管理总局", url: "https://www.nfra.gov.cn", date: "2026-09-30" }
  - { title: "中国证券监督管理委员会", url: "https://www.csrc.gov.cn", date: "2026-09-30" }

