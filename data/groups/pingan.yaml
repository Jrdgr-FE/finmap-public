group:
  id: pingan
  name: 中国平安保险（集团）股份有限公司
  short: 中国平安
  en: Ping An Insurance (Group) Company of China, Ltd.
  nature: 上市公司（A+H 两地上市，无控股股东、无实际控制人）
  founded: 1988
  hq: 深圳
  website: https://www.pingan.cn
  financial_platform: 深圳平安金融科技咨询有限公司（集团投资控股平台；中国平安未申设金融控股公司）
  intro: >-
    1988 年诞生于深圳蛇口，是中国第一家股份制保险企业，现于上交所（601318.SH）与港交所（2318.HK）两地上市，股权高度分散，无控股股东与实际控制人。牌照版图以保险为核心向外铺开：银行、信托、证券、期货、基金、保险资管、理财子、消费金融、融资租赁、货币经纪一应俱全，是国内金融牌照最齐全的综合金融集团之一。一个容易被误读的事实是：平安虽然长期被称作"全牌照金控"，却始终没有拿到金融控股公司牌照。央行 2022 年 3 月首批发牌给中信金控与北京金融控股集团，招商局金融控股于 2022 年 9 月获批，这份名单里没有中国平安。它的金融股权分散在集团本级、深圳平安金融科技咨询、平安信托等平台名下。
    2022 年通过平安人寿入主新方正集团，间接控制方正证券，证券牌照形成"平安证券 + 方正证券"双平台。
  sources:
    - { title: "中国平安官网 · 公司架构（成员企业）", url: "https://www.pingan.cn/about/corporate-architecture.shtml", date: "2026-09" }
    - { title: "中国平安 2025 年年度报告（释义：平安理财、平安证券、新方正集团、方正证券的控股链条）", url: "http://static.cninfo.com.cn/finalpage/2026-03-27/1225038263.PDF", date: "2026-03-27" }
    - { title: "中国平安《2025 年偿付能力报告》· 主要成员公司股权或控制关系及基本情况（持股比例、注册资本）", url: "https://www.pingan.com/app_upload/images/info/upload/980e2cc9-ab1b-488c-882b-5f57ffb8d28b.pdf", date: "2026" }
    - { title: "经济观察网《金控公司来了！首批牌照「花落」中信和北京金控》（央行受理名单不含中国平安）", url: "https://www.eeo.com.cn/2022/0317/526036.shtml", date: "2022-03-17" }
    - { title: "界面新闻《方正证券正式「易主」！中国平安成实控人》", url: "https://www.jiemian.com/article/8608336.html", date: "2022-12-20" }

