group:
  id: everbright
  name: "中国光大集团股份公司"
  short: "光大集团"
  en: "China Everbright Group"
  nature: "中央金融企业"
  founded: 1983
  hq: "北京"
  website: "https://www.ebchina.com"
  intro: "1983年8月在香港创办、2014年12月8日经国务院批准改制为股份制公司的国有大型金融控股集团，由财政部与中央汇金发起设立，中央汇金持股63.16%、财政部33.43%、北京社保基金理事会3.40%，是2002年国务院批准的三家综合金融控股集团试点之一。金融聚焦商业银行、投资银行、商业保险、资产管理四大板块，牌照横跨银行、证券、公募基金、期货、券商资管、信托、寿险、保险资管、金融租赁、消费金融、银行理财与地方AMC，是集齐主要金融牌照的少数集团之一。集团层面至今没有取得人民银行金融控股公司许可证：2021年6月4日人民银行受理其设立金融控股公司的行政许可申请，首批两张牌照于2022年3月发给中信金控与北京金控，光大集团的申请此后一直停留在审批环节，公开报道普遍把障碍归结为境外上市平台中国光大控股交叉持有光大证券20.73%和光大银行2.66%股权，不符合《金融控股公司监督管理试行办法》对股权清晰的要求。因此本图谱里光大集团只能作为「集团」理解，不能与中信金控、北京金控等持牌金控公司等同看待。境内外两条管理线：境内主体为中国光大集团股份公司，境外通过中国光大集团有限公司（香港）间接持有中国光大控股49.74%，光大控股再反向持有光大证券20.73%和光大银行2.66%——集团、光大控股、光大证券/光大银行之间是交叉持股，这是光大系与一般央企金控最不相同的地方，也是金控牌照迟迟未落地的原因。"
  sources:
    - { title: "中国光大集团官网·集团简介（1983年8月18日在香港创办；2014年12月8日改制为股份制公司）", url: "https://www.ebchina.com/ebchina/gywm/jtjj/index.html", date: "2026-09-30" }
    - { title: "中国光大集团官网·产品服务（金融成员名单：光大银行、光大证券、光大永明人寿、光大资产、光大信托、光大控股、光大金瓯、光大理财、光证资管、光大保德信基金、光大永明资产）", url: "https://www.ebchina.com/ebchina/cpfw/zcgl/gdxt/index.html", date: "2026-09-30" }
    - { title: "央行受理光大和中信设立金融控股公司申请（中国证券报／中国电子银行网）", url: "https://www.cebnet.com.cn/20210607/102753262.html", date: "2021-06-07" }
    - { title: "首批金控牌照来了！揭秘5家申设企业背后资本与旗下金融子公司（中国基金报：光大集团直接持股光大金控100%、光大信托51%、光大永明人寿50%、光大金瓯48%、光大证券25.15%）", url: "https://www.chnfund.com/article/AR2022031819061580325676", date: "2022-03-18" }
    - { title: "金控公司要来了！中信、光大申请获央行受理，模式或不同（第一财经：受理日2021年6月4日；汇金63.16%、财政部33.43%）", url: "https://www.yicai.com/news/101073869.html", date: "2021-06-05" }

