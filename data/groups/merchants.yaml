group:
  id: merchants
  name: 招商局集团有限公司
  short: 招商局集团
  en: China Merchants Group
  nature: 中央企业（国务院国资委履行出资人职责，中央直接管理的国有重要骨干企业）
  founded: 1872
  hq: 香港
  website: https://www.cmhk.com
  financial_platform: 招商局金融控股有限公司
  intro: >
    招商局创立于 1872 年洋务运动时期，总部位于香港，是央企中少见的"百年 + 驻港 + 综合"型集团，交通物流、综合金融、地产园区、科创产业四大板块并行。金融板块的入口是 2022 年 9 月获中国人民银行
    许可设立的招商局金融控股有限公司——全国第三张、粤港澳大湾区首张金控牌照，也是国务院国资委体系内
    第一家持牌央企金控。它的牌照版图有一条很清晰的主轴：招商银行自己就是一个持牌银行集团
    （理财子、金融租赁、基金、境外投行、人寿、消费金融、AIC 都在其下），招商证券则带着资管子公司、期货公司和博时基金，集团层再补上仁和人寿、招商平安资产、招商资本和集团财务公司。这个体系的特殊之处在于"双上市公司 + 双层持股"：招商银行与招商证券各自独立上市，集团对两者的持股通过招商局轮船、招商金控、集盛投资等多条通道实现，合计口径与直接口径差距不小。
  sources:
    - { title: "招商局集团官网 · 经营发展", url: "https://www.cmhk.com/main/xxgk/jyfz/index.html", date: "2026-09-30" }
    - { title: "第三家！招商金控获批，风险并表法人机构约670家 — 证券时报", url: "https://news.stcn.com/sd/202209/t20220903_4839732.html", date: "2022-09-03" }
    - { title: "招商银行股份有限公司2025年年度报告（H股）", url: "https://www.hkexnews.hk/listedco/listconews/sehk/2026/0327/2026032703380_c.pdf", date: "2026-03-27" }

