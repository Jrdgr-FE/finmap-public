group:
  id: citic
  name: 中国中信集团有限公司
  short: 中信集团
  en: CITIC Group
  nature: 中央金融企业（国有独资，财政部代表国务院履行出资人职责）
  founded: 1979
  hq: 北京
  website: https://www.group.citic
  financial_platform: 中国中信金融控股有限公司（中信金控，2022 年 3 月获批）
  intro: >-
    1979 年由荣毅仁创办，是改革开放后最早成立的综合性企业集团之一，业务横跨
    综合金融服务、先进智造、先进材料、新消费、新型城镇化五大板块。金融牌照的完整度在国内集团里数第一档：银行、证券、信托、保险、金融资产、金融租赁、基金、期货、消费金融、财务公司十类齐全。
    2022 年设立中信金控，把分散的金融股权集中到一张金控牌照之下。
  sources:
    - { title: "中信集团官网 · 多元中信", url: "https://www.group.citic/html/Diversified_Portfolio/", date: "2026-02" }
    - { title: "中国中信集团有限公司各级财务并表子公司名单（截至2026年3月末）", url: "https://www.group.citic/uploadfile/2026/0416/20260416453660.pdf", date: "2026-03-31" }
    - { title: "中国经营报《百亿加码金租 中信集团再扩金融版图》", url: "https://app.dahecube.com/nweb/news/20250112/223492n58303fd3302.htm", date: "2025-01-12" }

