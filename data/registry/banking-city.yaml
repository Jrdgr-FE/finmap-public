note: >
  收录国家金融监督管理总局《银行业金融机构法人名单》中机构类型列为“城市商业银行”的全部法人机构，
  不含其分支机构，也不含城市信用社、农村商业银行、股份制商业银行与民营银行。
  名单版本为截至 2025 年 12 月 31 日（2026 年 8 月 14 日发布），共 123 家；与截至 2025 年 6 月末的 124 家相比减少 1 家，
  系新疆汇和银行被新疆银行吸收合并。金融许可证信息查询系统中“机构类型＝城市商业银行、机构级别＝法人”的记录同为 123 条，可相互印证。
  license_code 取自法人名单的“机构编码”字段；founded 取金融许可证的“批准成立日期”年份（该字段指监管部门批准该机构设立的日期）。
  威海银行、广东华润银行两家在 2026 年已完成更名换证，本文件机构名称沿用 2025 年末法人名单口径，并在 intro 中注明换证情况。
