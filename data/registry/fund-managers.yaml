note: >
  本名册收录中国境内依法设立、由中国证监会核准的公募基金管理公司（基金管理公司法人主体），不含取得公募资格的券商资管、保险资管等资产管理机构，也不含基金销售机
  构与基金托管机构。名单以中国证监会《公募基金管理机构名录》为基准：该名录「基金管理公司名单」页签共 150 家，与中基协披露的口径（截至 2026 年 8 
  月底境内公募基金管理机构 165 家＝基金管理公司 150 家＋取得公募资格的资产管理机构 15 家）一致。成立年份、股东背景、官网均逐家核对，核对截止日期
   2026-09-30。
sources:
  - { title: "中国证监会《公募基金管理机构名录》（2026年7月）", url: "http://www.csrc.gov.cn/csrc/c101900/c1029657/content.shtml", date: "2026-07-31" }
  - { title: "中国证券投资基金业协会《公募基金管理人名录》", url: "https://www.amac.org.cn/fwdt/wyc/jgcprycx/jgcx/gmjjglrml/", date: "2026-09-30" }
