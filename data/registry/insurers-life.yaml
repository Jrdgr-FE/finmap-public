note: >
  本文件收录国家金融监督管理总局《保险机构法人名单》“人身保险公司”口径下的全部法人机构共 92 家，即寿险公司 75 家、养老保险公司 10 家、健康险公司 7 家；信美人寿相互保险社在名单中计入寿险公司，长江养老保险股份有限公司在名单中标注为养老保险公司（按保险资产管理公司管理），本文件仍按人身险口径收录。名单依据为《保险机构法人名单（截至2025年6月30日）》，系截至2026年9月30日可核验的最新一期官方名册。该名单公布的机构编码是保险机构编码，与保险公司偿付能力报告中披露的“保险机构法人许可证号”并非同一字段，因此 license_code 只填写能从公司官方披露文件逐条核实的条目，取不到的条目一律省略，不作推测。
sources:
  - { title: "国家金融监督管理总局《保险机构法人名单》（截至2025年6月30日）", url: "https://www.nfra.gov.cn/chinese/docfile/2025/2a78efc6d162484f8dfb8d0388b00320.pdf", date: "2025-06-30" }
