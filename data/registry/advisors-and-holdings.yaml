note: >-
  本文件收录三类主体：① 持中国证监会证券投资咨询业务许可的证券投资咨询机构，按中国证监会《证券投资咨询机构名录
  （2026年7月）》逐条收全，共 76 家；② 证券金融公司 1 家，即中国证券金融股份有限公司；③ 地方金融控股公司 25 家，
  均为省级或计划单列市政府出资、以金融为主业的国有金融资本运营平台。核对截止日期 2026-09-30。
  证券投资咨询机构的 name 与证监会名录原文的机构名称逐字一致，名录中括注的曾用名（上海中和应泰、上海中广云、湖北无为股道三家）
  写在对应条目的 intro 里；注册地取名录的「辖区（注册地）」列。
  website 均逐个用 HTTP 请求打开核对页面标题或正文确属该公司，打不开、域名被他人占用或只有 JS 空壳无法确认的一律省略；
  founded 只写公司官网或官方文件明确写出的成立年份，查不到的一律省略，不作估算。
  地方金融控股公司一类中，仅北京金融控股集团有限公司已按《金融控股公司监督管理试行办法》取得中国人民银行的金融控股公司
  设立许可，其余各家是省（市）级国有金融资本运营平台，由省财政厅或省国资委履行出资人职责；regulator 字段按本图谱
  holding 分类的口径统一填写「中国人民银行」，并不表示每一家都已持金融控股公司牌照。
