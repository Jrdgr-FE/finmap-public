note: >-
  本文件收录国家金融监督管理总局《银行业金融机构法人名单》（截至 2025 年 6 月 30 日）中机构类型标注为信托公司、消费金融公司、汽车金融公司、
  货币经纪公司的全部法人机构，共 129 家（信托公司 67 家、消费金融公司 31 家、汽车金融公司 25 家、货币经纪公司 6 家），家数与机构编码均逐条对照该名单，
  name 与 license_code 取自名单原文。信托公司历史上有 68 家，新华信托已于 2023 年破产清算并被移出名单；名单内仍处于接管、
  破产重整或破产清算阶段的主体（华信信托、新时代信托、华泰汽车金融）status 记为 exited 并在 intro 说明，四川信托重整后已恢复展业记为 active，
  其余为 active。官网只在实测可打开且页面内容确属该公司时保留，共 123 家列出 website；国联信托、雪松国际信托、华信信托、苏银凯基消费金融、
  蚂蚁消费金融、三一汽车金融 6 家因官网无法实测核实而省略该字段；founded 只保留有官方名单、机构官网或机构年报等可核验来源的年份，共 103 家列出，
  其余 26 家未能核实故省略。
sources:
  - { title: "国家金融监督管理总局《银行业金融机构法人名单》（截至2025年6月30日）", url: "https://www.nfra.gov.cn/chinese/docfile/2025/86c58b1ad810422c8fa6c6d0107f1626.pdf", date: "2025-06-30" }
  - { title: "国家金融监督管理总局", url: "https://www.nfra.gov.cn", date: "2026-09-30" }
