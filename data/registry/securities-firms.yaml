note: >
  收录中国证监会口径下全部证券公司法人机构 115 家，即 taxonomy 中 category 为 
  securities、type 为 securities-firm 的全部主体。基准名单取自中国证券业协会证券公
  司基本信息公示的证券公司类 150 条，其中券商资管子公司与承销保荐子公司 35 条不属于本文件范围、另归其他 
  type，已剔除；并用证监会各辖区证券公司名录逐区交叉核对，未发现协会名单遗漏的证券公司法人体。注册地、注册资本
  、统一社会信用代码或业务许可证号、业务资格范围与官网取自协会公示，成立年份取自协会公示所附各公司年度报告公开披露
  信息或公司官网公司简介，上市地与代码取自沪深交易所与港交所上市数据。数据截至 2026 年 9 月 30 日。

