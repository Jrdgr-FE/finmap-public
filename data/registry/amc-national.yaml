note: >-
  全国性金融资产管理公司。中国自 1999 年起先后设立五家全国性 AMC，机构编码在监管总局《银行业金融机构法人名单》里是 J0001—J0005。其中中国中信金融资产管理股份有限公司（原中国华融）已在中信集团谱系里收录，本文件收录其余四家。
