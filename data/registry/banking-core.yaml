note: >
  本文件收录国家金融监督管理总局《银行业金融机构法人名单》中「机构类型」属于开发性金融机构、政策性银行、国有大型商业银行、股份制商业银行、民营银行、独立法人直销银行六类的全部法人机构，共 41 家：开发性金融机构 1 家、政策性银行 2 家、国有大型商业银行 6 家、股份制商业银行 12 家、民营银行 19 家、直销银行 1 家。机构编码与机构类型取自该名单（本文实际下载核对的一期为
  截至 2025 年 6 月 30 日），机构数量与构成按金融监管总局 2026 年 8 月 14 日披露的最新一期
  （截至 2025 年 12 月 31 日）校正——该期直销银行由 2 家减为 1 家，中邮邮惠万家银行已于 2025 年
  被邮储银行吸收合并，法人资格不再存续，故不收录；其余五类的家数较上一期未变。城市商业银行、农村商业银行、村镇银行、外资法人银行等 taxonomy 中同属 banking 的其他类型不在本文件范围内。
sources:
