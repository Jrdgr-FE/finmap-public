note: >-
  本文件按中国证监会《期货公司名录》收录境内全部期货公司法人主体，共 150 家，以 2026 年 8 月版名录（2026 年 9 月 4 日发布）为准，并与中国期货业协会《期货公司基本情况公示》逐一核对。只收期货公司法人主体，不含风险管理子公司、期货交易所及已注销机构；中国期货业协会《期货公司基本情况公示》同样为 150 家，两者名单一致。股东持股、注册资本、经营范围与官网取自中国期货业协会公示，成立年份取自该协会披露的公司历史沿革中「公司成立」事件，官网核对日期为 2026 年 9 月 30 日。
sources:
