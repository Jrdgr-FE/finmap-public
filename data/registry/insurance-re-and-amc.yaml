note: >
  本文件收录中国境内两类持牌保险机构：再保险公司（含中资/外资法人再保险与外国再保险公司在华分公司）和保险资产管理公司，共 50 家。名单依据国家金融监督管理总局《保险机构法人名单》（截至2025年6月30日）与同局《外国再保险公司分公司名单》（截至2024年12月31日）逐条核对，机构编码取自官方名单；金融监管总局 2026-08-14 披露的截至2025年末家数（保险机构法人 239 家、外国再保险公司分公司 8 家）与上述两份名单一致，年内无增减。保险资管口径另与中国银行保险资产管理业协会《中国保险资产管理业
  发展报告（2025）》交叉核对：该报告按「35 家保险资产管理公司」统计，即名单内 34 家保险资产管理公司
  加长江养老保险股份有限公司（2023 年变更业务范围后按保险资产管理公司管理），本文件按 35 家收录。外国再保险公司在华分支均为分公司、不是独立法人，其法人母体写在各条 intro 中；本文件不重复收录
  中国再保险（集团）股份有限公司等保险集团（控股）公司。
sources:
  - { title: "国家金融监督管理总局 保险机构法人名单（截至2025年6月30日）", url: "https://www.nfra.gov.cn/chinese/docfile/2025/2a78efc6d162484f8dfb8d0388b00320.pdf", date: "2025-06-30" }
  - { title: "国家金融监督管理总局 外国再保险公司分公司名单（截至2024年12月31日）", url: "https://www.nfra.gov.cn/chinese/docfile/2025/4fa9ae7e292145198b4609d126fffce8.pdf", date: "2024-12-31" }
  - { title: "中国银行保险资产管理业协会《中国保险资产管理业发展报告（2025）》（截至2024年末共35家保险资产管理公司）", url: "https://www.eeo.com.cn/2025/1124/768679.shtml", date: "2025-11-24" }
