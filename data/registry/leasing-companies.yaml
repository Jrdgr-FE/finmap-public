note: >-
  本文件收录国家金融监督管理总局《银行业金融机构法人名单》中机构类型标注为金融租赁公司的全部持牌法人机构，依据截至 2025 年 6 月 30 日的官方名单逐条核对，共 70 家，金融许可证机构编码均以 M 开头（M0001H211000001—M0078H232010001）。只收金融监管总局批设的金融租赁公司，不含商务部及地方批设的外商投资融资租赁企业。
  name 与 license_code 同官方名单一致；官网均经逐家打开核对内容确属该公司，无独立官网的（含仅挂在母行网站频道页下的）省略 website。
