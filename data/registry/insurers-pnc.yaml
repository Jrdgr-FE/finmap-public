note: >
  覆盖国家金融监督管理总局《保险机构法人名单》中机构类型为「财险公司」的全部 88 家法人机构，另收录政策性保险公司中国出口信用保险公司，合计 89 家，是完整名单而非抽样；人身险、养老险、健康险、再保险、保险资管、保险中介，以及该名单单列为「其他」的 3 家农村保险互助社均不在内，名单本身也只列法人机构、不含分支机构。名单版本为截至 2025-06-30 的一期（该期共 238 家保险法人机构），交叉核对来源为中国保险行业协会会员名录；自保公司与相互保险组织因 taxonomy 无单独类型，统一归 pnc-insurer 并在 intro 说明性质。license_code 取自该名单「机构编码」列，即《保险机构法人许可证》上的机构编码；founded 只用官网公司简介、公司年报或监管批复文书的官方口径；website 已于 2026-09-30 逐一实际打开并确认页面属于该机构，取不到内容的一律留空不估算。

sources:
  - { title: "国家金融监督管理总局《保险机构法人名单》（截至2025年6月30日）", url: "https://www.nfra.gov.cn/chinese/docfile/2025/2a78efc6d162484f8dfb8d0388b00320.pdf", date: "2025-06-30" }
  - { title: "中国保险行业协会", url: "https://www.iachina.cn", date: "2026-09-30" }

