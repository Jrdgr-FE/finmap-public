note: >-
  本文件收录经原中国银保监会、国家金融监督管理总局公布名单的地方资产管理公司（地方 AMC）共 61 条：以 2022 年 3 月原银保监会官网公布的 59 家名单为基准，加上 2023 年 8 月获批的全国第 60 家深圳资产管理有限公司，以及 2026 年 2 月自上海国有资产经营有限公司承接地方 AMC 业务资质的上海国际集团申信资产管理有限公司。名单内黑龙江省嘉实龙昇金融资产管理有限公司已于 2024 年 1 月注销（status: exited），故在营主体为 60 家；截至 2025 年 6 月末监管口径为 59 家，31 个省级行政区（不含港澳台）与大连、宁波、厦门、青岛、深圳 5 个计划单列市均已设立，无空白省份。监管上由国家金融监督管理总局制定规则并公布名单、省级地方金融管理机构对本地区地方 AMC 监督管理和风险处置负总责，故 regulator 统一记为地方金融管理局；全国性 AMC（中信金融资产、长城、东方、信达、银河）已在 amc-national.yaml 收录，本文件不重复。
