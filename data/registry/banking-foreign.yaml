note: >
  本文件收录国家金融监督管理总局《银行业金融机构法人名单》中机构类型标注为外资法人银行的全部机构，依据截至 2025 年 6 月 30 日的官方名单逐条核对，共 41 家（与截至 2025 年 12 月 31 日名单中的 41 家一致）。只收在中国境内注册的法人银行，不含外国及港澳台银行分行、外国银行代表处，也不含中德住房储蓄银行
  （该行在官方名单中单列为住房储蓄银行类型）。name、license_code 与官方名单一致，官网核对日期为 2026 年 9 月 30 日。
sources:
  - { title: "国家金融监督管理总局《银行业金融机构法人名单（截至2025年6月30日）》", url: "https://www.nfra.gov.cn/chinese/docfile/2025/86c58b1ad810422c8fa6c6d0107f1626.pdf", date: "2025-10-09" }
  - { title: "国家金融监督管理总局", url: "https://www.nfra.gov.cn", date: "2026-09-30" }

